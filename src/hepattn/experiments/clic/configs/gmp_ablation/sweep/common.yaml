# GMP ablation: the ONE training setup shared by every arm and seed. Overlay on base.yaml (main.py loads it implicitly),
# BEFORE the arm overlay configs/gmp_ablation/sweep/<arm>.yaml (generated by gmp_ablation/sweep.py):
#
#   python main.py fit -c configs/gmp_ablation/sweep/common.yaml -c configs/gmp_ablation/sweep/<arm>.yaml [launcher args]
#
# EXECUTION (required for every ablation run; enforced by gmp_ablation/preflight.py on the resolved config and by the
# DDPGuard callback inside the live process group, both before the first step):
#   ONE model per run, 4 x A100 of ONE node via DDP (4 ranks), micro-batch 256 per GPU, accumulate 1 -> global batch
#   1024, bf16-mixed, torch.compile. One run at a time (submit_gmp_run.sh, chained by gmp_ablation/campaign.py).
#   (The one-epoch pilot, job 7843955, ran 4 arms side by side at 1 GPU x accumulate 4; that pattern is retired.)
#
# RECIPE = base.yaml's, unchanged: Lion, OneCycle 1e-6 -> 8e-5 -> 1e-6 with 5% warm-up, weight decay 1e-4, gradient
# clip 0.1. The OneCycle schedule spans trainer.max_epochs (set per campaign by the launcher), so a run of N epochs is
# one complete schedule; runs are compared at equal max_epochs only. Seed: --seed_everything from the launcher.
# A run split into several jobs resumes from its last epoch checkpoint and SegmentStop ends each job at an epoch
# boundary: the schedule is the uninterrupted run's, step for step.
# DATA: full training set, the fixed 5000-event validation selection (4959 after cuts), validation every epoch.
trainer:
  max_epochs: 1 # placeholder: the launcher sets the campaign's budget (preflight checks it)
  accelerator: gpu
  devices: 4
  num_nodes: 1
  strategy: auto # Lightning picks DDP for 4 devices; DDPGuard asserts it
  accumulate_grad_batches: 1
  precision: bf16-mixed
  gradient_clip_val: 0.1
  log_every_n_steps: 50
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0

  # bench3's CSVLogger subclass: the CLI links --name to trainer.logger.init_args.name
  logger:
    class_path: hepattn.experiments.clic.bench3.logger.CSVLogger
    init_args:
      save_dir: logs

  # A list overlay REPLACES base.yaml's. Dropped from base: InferenceTimer and PflowPredictionWriter (test-time only).
  callbacks:
    # torch 2.9's DDPOptimizer graph split fails on the patch encoder; optimize_ddp=False is the production DDP setting
    - class_path: hepattn.callbacks.DynamoOptimizeDDP
    - class_path: hepattn.callbacks.Compile
    - class_path: hepattn.experiments.clic.gmp_ablation.ddp_guard.DDPGuard
    - class_path: hepattn.callbacks.SaveConfig
    - class_path: hepattn.callbacks.Checkpoint
      init_args:
        monitor: val/loss
        save_last: true
        # hepattn's Checkpoint uploads each checkpoint to Comet when log_model is true (its default); the sweep logs to
        # CSV, whose writer has no log_model, so every pilot arm crashed after saving its checkpoint (job 7843955).
        log_model: false
    - class_path: lightning.pytorch.callbacks.ModelSummary
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    - class_path: lightning.pytorch.callbacks.TQDMProgressBar
      init_args:
        refresh_rate: 200
    - class_path: hepattn.experiments.clic.gmp_ablation.segment.SegmentStop
    # parameter counts, real dtypes, NaN/inf counts, per-epoch time / steps/s / peak memory -> $GMP_DIAG_OUT
    - class_path: hepattn.experiments.clic.gmp_ablation.diagnostics.GMPDiagnostics

data:
  num_train: -1
  num_val: 5000
  batch_size: 256 # per GPU
  num_workers: 7 # per rank: 4 ranks x (7 workers + matcher) on 32 cores, as the bench3 4-GPU runs

model:
  model:
    init_args:
      matcher:
        init_args:
          n_jobs: 8 # per rank, as the bench3 4-GPU runs
